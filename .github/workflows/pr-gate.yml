name: Zero-Noise PR Gate

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Merge Conflict Markers
        run: |
          if grep -rnE "^<<<<<<< |^=======|^>>>>>>> " --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::Found unresolved merge conflict markers!"
            exit 1
          fi

      - name: Basic Secret Leak Check
        run: |
          if grep -rnE "AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36}|BEGIN[ ]PRIVATE[ ]KEY" --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::Potential secret leak detected!"
            exit 1
          fi

      - name: Setup Node.js if package.json exists
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & Validate Project
        run: |
          if [ -f "package.json" ]; then
            echo "Node project detected."
            npm ci || npm install
            if grep -q '"build"' package.json; then
              npm run build
            fi
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "Python project detected."
            python -m py_compile $(git ls-files '*.py') || true
          else
            echo "Static assets / docs project detected. Validation passed."
          fi
